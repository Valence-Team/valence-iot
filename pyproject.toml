[project]
name = "valence-ia"
version = "0.1.0"
description = "Serviço de IA do Valence: visão computacional, RAG e explicação com IA generativa"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integracao: fluxo de ponta a ponta com os modelos reais"]
